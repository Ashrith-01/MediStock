# MediStock - Production Configuration
spring.application.name=medistock-backend

# Server
server.port=${SERVER_PORT:8081}

# PostgreSQL Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/medistock}

spring.datasource.username=${DB_USERNAME:postgres}

spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=false

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Jackson
spring.jackson.default-property-inclusion=non_null

# JWT
app.jwt.secret=${JWT_SECRET}

app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Email / Gmail SMTP
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}

spring.mail.port=${SPRING_MAIL_PORT:587}

spring.mail.username=${SPRING_MAIL_USERNAME}

spring.mail.password=${SPRING_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_HOST:smtp.gmail.com}

# Notification Configuration
app.notification.recipient-email=${NOTIFICATION_RECIPIENT_EMAIL:${SPRING_MAIL_USERNAME}}